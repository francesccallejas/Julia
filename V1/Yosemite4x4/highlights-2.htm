<!DOCTYPE html>
<html>
<head>
  <title>Julia Yosemite 4x4 — Opció 2 (glass)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <link rel="shortcut icon" href="../Imatges/Julia_Camper_logo.png" type="image/x-icon">
  <link href="../estils.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
  <style>
    /* ---- Opció 2: la pastilla de les 5 prime specs integra un carrousel de 3 fotos.
            El plano (layout) NO porta glass; nomes la pastilla de specs i els highlights. ---- */
    .opt2 .hl-mid{ align-items:stretch; gap:44px; }
    .opt2 .hl-plan{ max-width:38%; }

    .opt2 .hl-specpod{
      flex:1; display:flex; flex-direction:column; gap:22px;
      background:rgba(12,16,11,0.55);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:22px;
      padding:26px 30px 24px;
      -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    }
    .opt2 .hl-specpod .hl-specs{ gap:18px 32px; }
    .opt2 .hl-specpod .spec .num{ font-size:44px; }
    .opt2 .hl-specpod .spec .lbl{ font-size:19px; margin-top:5px; }
    .opt2 .specpod-sep{ height:1px; background:rgba(255,255,255,0.14); }

    /* carrousel */
    .pc{ position:relative; }
    .pc-stage{ position:relative; width:100%; height:210px; border-radius:14px; overflow:hidden;
      box-shadow:0 8px 22px rgba(0,0,0,.4); }
    .pc-slide{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      opacity:0; transition:opacity .8s ease; }
    .pc-slide.is-on{ opacity:1; }
    .pc-dots{ display:flex; gap:9px; justify-content:center; margin-top:12px; }
    .pc-dots span{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.35); transition:background .3s; }
    .pc-dots span.active{ background:var(--jc-orange); }
  </style>
  <script language="JavaScript" src="dades.js"></script>
  <script language="JavaScript" src="../funcions.js"></script>
</head>
<body class="opt2" onLoad="setTimeout(function(){renderHighlightsFull(dades); mountTotemStage('highlights'); scaleTotemStage(); mountPhotoCarousel('pc2'); fitHighlights();},30);">

  <video autoplay muted loop playsinline id="myVideo">
    <source src="../Imatges/videos furgo junts.mp4" type="video/mp4">
  </video>
  <div id="bg-scrim"></div>

  <section class="header5 mbr-fullscreen hl" id="header05-1">
    <div class="align-center fixed-top hl-content">

      <header class="hl-head">
        <img class="logo-julia" src="../Imatges/Julia_logo_white.png" alt="Julia">
        <h1 class="hl-title">YOSEMITE 4x4</h1>
        <p class="tagline">The 6m Sprinter model to reach every summit.</p>
      </header>

      <div class="hl-mid">
        <div class="hl-plan">
          <img src="../Imatges/yosemitte_plan.png" alt="Yosemite plan">
        </div>
        <div class="hl-specpod">
          <div class="hl-specs">
            <div class="spec"><div class="num">3500 kg</div><div class="lbl">MMTA <sup>**</sup></div></div>
            <div class="spec"><div class="num">593 cm</div><div class="lbl">Length</div></div>
            <div class="spec"><div class="num">206 cm</div><div class="lbl">Width</div></div>
            <div class="spec"><div class="num">280 cm</div><div class="lbl">High <sup>***</sup></div></div>
            <div class="spec"><div class="num">4 &ndash; 4</div><div class="lbl">Day / Evening places</div></div>
          </div>
          <div class="specpod-sep"></div>
          <div class="pc" id="pc2">
            <div class="pc-stage">
              <img class="pc-slide" src="../Imatges/foto-camper-1.png" alt="">
              <img class="pc-slide" src="../Imatges/foto-camper-2.png" alt="">
              <img class="pc-slide" src="../Imatges/foto-camper-3.png" alt="">
            </div>
            <div class="pc-dots"></div>
          </div>
        </div>
      </div>

      <div class="hl-features">
        <div class="hl-features-title">EQUIPMENT HIGHLIGHTS</div>
        <div id="t_highlights_full" class="hl-list"></div>
      </div>

    </div>
  </section>
</body>
</html>
