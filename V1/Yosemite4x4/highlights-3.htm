<!DOCTYPE html>
<html>
<head>
  <title>Julia Yosemite 4x4 — Opció 3 (gallery)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <link rel="shortcut icon" href="../Imatges/Julia_Camper_logo.png" type="image/x-icon">
  <link href="../estils.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
  <style>
    /* ---- Opció 3: gallery. Triptic de 3 fotos + 5 prime specs treballades
            com una tira horitzontal amb separadors. ---- */
    .opt3 .hl-content{ gap:26px; }

    /* Triptic de fotos */
    .gallery{ display:flex; gap:16px; width:100%; height:330px; }
    .gallery figure{ position:relative; flex:1; margin:0; border-radius:16px; overflow:hidden;
      box-shadow:0 12px 30px rgba(0,0,0,.45); }
    .gallery figure.mid{ flex:1.35; }
    .gallery img{ width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 6s ease; }
    .gallery figure:hover img{ transform:scale(1.05); }

    /* Tira de prime specs */
    .hl-specstrip{
      display:flex; align-items:stretch; justify-content:space-between;
      background:rgba(12,16,11,0.42);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:18px; padding:22px 8px;
      -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
    }
    .hl-specstrip .spec{ flex:1; text-align:center; padding:0 6px;
      border-left:1px solid rgba(255,255,255,0.14); }
    .hl-specstrip .spec:first-child{ border-left:0; }
    .hl-specstrip .spec .num{ color:#fff; font-size:40px; font-weight:800; line-height:1;
      white-space:nowrap; text-shadow:0 2px 12px rgba(0,0,0,.6); }
    .hl-specstrip .spec .lbl{ color:rgba(255,255,255,.82); font-size:17px; margin-top:8px;
      text-transform:uppercase; letter-spacing:1px; }
    .hl-specstrip .spec .lbl sup{ font-size:.7em; }

    /* Plano compacte centrat */
    .opt3 .hl-planrow{ display:flex; justify-content:center; }
    .opt3 .hl-planrow img{ max-height:300px; max-width:70%; width:auto; height:auto;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.55)); }
  </style>
  <script language="JavaScript" src="dades.js"></script>
  <script language="JavaScript" src="../funcions.js"></script>
</head>
<body class="opt3" onLoad="setTimeout(function(){renderHighlightsFull(dades); mountTotemStage('highlights'); scaleTotemStage(); fitHighlights();},30);">

  <video autoplay muted loop playsinline id="myVideo">
    <source src="../Imatges/videos furgo junts.mp4" type="video/mp4">
  </video>
  <div id="bg-scrim"></div>

  <section class="header5 mbr-fullscreen hl" id="header05-1">
    <div class="align-center fixed-top hl-content">

      <header class="hl-head">
        <img class="logo-julia" src="../Imatges/Julia_logo_white.png" alt="Julia">
        <h1 class="hl-title">YOSEMITE 4x4</h1>
        <p class="tagline">The 6m Sprinter model to reach every summit.</p>
      </header>

      <div class="gallery">
        <figure><img src="../Imatges/Yosemite4x4/foto-camper-1.png" alt=""></figure>
        <figure class="mid"><img src="../Imatges/Yosemite4x4/foto-camper-3.png" alt=""></figure>
        <figure><img src="../Imatges/Yosemite4x4/foto-camper-2.png" alt=""></figure>
      </div>

      <div class="hl-specstrip">
        <div class="spec"><div class="num">3500 kg</div><div class="lbl">MMTA <sup>**</sup></div></div>
        <div class="spec"><div class="num">593 cm</div><div class="lbl">Length</div></div>
        <div class="spec"><div class="num">206 cm</div><div class="lbl">Width</div></div>
        <div class="spec"><div class="num">280 cm</div><div class="lbl">High <sup>***</sup></div></div>
        <div class="spec"><div class="num">4 &ndash; 4</div><div class="lbl">Day / Evening</div></div>
      </div>

      <div class="hl-planrow">
        <img src="../Imatges/yosemitte_plan.png" alt="Yosemite plan">
      </div>

      <div class="hl-features">
        <div class="hl-features-title">EQUIPMENT HIGHLIGHTS</div>
        <div id="t_highlights_full" class="hl-list"></div>
      </div>

    </div>
  </section>
</body>
</html>
