<title>Basic (tot junt, 8px min)</title>
<style>
/* Minimal grid stand-in for LOCAL PREVIEW ONLY — the real totem already has
   the full Bootstrap 5 bundle in ../assets/bootstrap/. This stub is not part
   of the deliverable, it only exists so the layout can be screenshotted here. */
*{box-sizing:border-box;}
body{margin:0;}
.container,.container-fluid{width:100%;padding-left:15px;padding-right:15px;margin-left:auto;margin-right:auto;}
.row{display:flex;flex-wrap:wrap;margin-left:-15px;margin-right:-15px;}
.row > [class*="col"]{padding-left:15px;padding-right:15px;}
.col-12{flex:0 0 100%;max-width:100%;}
.col-md-12{flex:0 0 100%;max-width:100%;}
.col-lg-8{flex:0 0 66.66%;max-width:66.66%;margin-left:16.66%;}
.col-lg-9{flex:0 0 75%;max-width:75%;margin-left:12.5%;}
.justify-content-center{justify-content:center;}
.mt-5{margin-top:3rem;}
.pt-5{padding-top:3rem;}
.align-center{text-align:center;}
.fixed-top{position:relative;}
.mbr-fullscreen{min-height:100vh;position:relative;display:flex;align-items:center;}
.mbr-fallback-image{position:absolute;top:0;left:0;width:100%;height:100%;background:url(Imatges/hero_fallback.png) center/cover;}
.mbr-fallback-image.disabled{display:block;}
section{position:relative;}
/* Nomes el vel blanc de video (identificat pel seu propi background inline)
   es absolut; ".mbr-overlay" tambe s'usa en altres contenidors de contingut
   normal i aquests han de quedar en flux normal. */
.mbr-overlay[style*="255, 255, 255"]{position:absolute;top:0;left:0;width:100%;height:100%;}

/* =============================================================
   Julià Camper — Tòtem fira — estils v2
   Mateixes pantalles i mateix HTML/JS (highlights, basic, expo).
   Només look & feel: tipografia, color, espaiat, jerarquia i
   robustesa visual (fallback si el vídeo no carrega).
   ============================================================= */

/* Plus Jakarta Sans: es carrega via Google Fonts al totem real; aqui la CSP de l'artifact la bloqueja -> fallback del sistema. */

:root{
  --jc-font: 'Plus Jakarta Sans', Verdana, "Segoe UI", Arial, sans-serif;
  --jc-orange: #FF8000;
  --jc-orange-dark: #CC6600;
  --jc-ink: #1c1f1a;
  --jc-charcoal: #2c3422;
  --jc-paper: #faf9f6;
  --jc-panel: #ffffff;
  --jc-line: #e4e1d8;
  --jc-muted: #6b6f63;

  --step--1: clamp(0.9rem, 0.6vw + 0.7rem, 1.05rem);
  --step-0:  clamp(1.05rem, 0.7vw + 0.85rem, 1.3rem);
  --step-1:  clamp(1.3rem, 1vw + 1rem, 1.7rem);
  --step-2:  clamp(1.8rem, 1.6vw + 1.2rem, 2.6rem);
  --step-3:  clamp(2.6rem, 2.8vw + 1.4rem, 4rem);
}

html, body{
  background: var(--jc-paper);
  font-family: var(--jc-font);
  color: var(--jc-ink);
}

/* ---------- Marca / capçalera comuna (basic.htm, expo.htm) ---------- */
.align-center.fixed-top{
  max-width: 1600px;
  margin: 0 auto;
  padding: clamp(16px, 2vw, 40px) clamp(16px, 3vw, 56px) 60px;
}

.align-center.fixed-top > div[style*="padding:10px"]{
  padding: 0 !important;
  display: flex;
  align-items: center;
  gap: clamp(16px, 2vw, 32px);
  margin-bottom: clamp(20px, 2.5vw, 36px);
  border-bottom: 3px solid var(--jc-orange);
  padding-bottom: clamp(14px, 1.6vw, 22px) !important;
}

.align-center.fixed-top > div[style*="padding:10px"] img{
  width: clamp(140px, 14vw, 220px) !important;
  height: auto;
  flex: 0 0 auto;
}

.align-center.fixed-top > div[style*="padding:10px"] h1{
  font-family: var(--jc-font) !important;
  font-size: var(--step-3) !important;
  font-weight: 800 !important;
  letter-spacing: 0.5px;
  color: var(--jc-charcoal);
  margin: 0;
  line-height: 1;
}

/* ---------- Insígnia de versió (BASIC / EXPOSITION / AUSSTELLUNG...) ---------- */
.model{
  display: inline-block;
  margin: 0 0 clamp(24px, 3vw, 40px) !important;
  border: none !important;
  background: linear-gradient(135deg, var(--jc-orange), var(--jc-orange-dark));
  color: #fff;
  font-family: var(--jc-font);
  font-size: var(--step-1) !important;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  width: auto !important;
  min-width: 260px;
  padding: 14px 32px !important;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(255,128,0,0.25);
  text-align: center;
}

/* ---------- Taula de preus ---------- */
.preus{
  float: none !important;
  width: 100% !important;
  max-width: 780px;
  margin: 0 0 32px auto !important;
  padding: clamp(18px, 2vw, 28px) clamp(20px, 2.4vw, 32px) !important;
  background: var(--jc-panel);
  border: 1px solid var(--jc-line);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(28,31,26,0.06);
  font-size: 14px;
  font-family: var(--jc-font);
}

.preus table{
  width: 100%;
  border-collapse: collapse;
}

.preus table tr{
  border-bottom: 1px solid var(--jc-line);
}

.preus table tr:last-child{
  border-bottom: none;
}

.preus table td{
  padding: 10px 6px;
  font-size: var(--step--1);
  line-height: 1.4;
}

.preus table tr td:first-child{
  color: var(--jc-ink);
}

/* fila de total intermedi (separa) i final (total) es reconeixen
   perque funcions.js ja els deixa amb <b> i border-top inline;
   els reforcem visualment sense dependre'n */
.preus table tr:has(td[style*="border-top"]){
  border-top: 2px solid var(--jc-charcoal) !important;
  margin-top: 6px;
}

.preus table tr:has(td b){
  background: rgba(255,128,0,0.06);
}

.preus table tr:has(td b) td{
  font-size: 14px;
  color: var(--jc-charcoal);
  padding-top: 14px;
  padding-bottom: 14px;
}

.preus table tr:last-child td{
  font-size: 19px !important;
  color: var(--jc-orange-dark);
  font-weight: 800;
}

.titol_taula{
  font-size: 15px !important;
  color: var(--jc-charcoal);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding-bottom: 14px !important;
  border-bottom: 2px solid var(--jc-orange);
}

/* ---------- Taula de característiques (camper + xassís) ---------- */
.carac{
  padding: clamp(18px, 2vw, 28px) !important;
  font-size: var(--step--1) !important;
  font-family: var(--jc-font);
  background: var(--jc-panel);
  border: 1px solid var(--jc-line);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(28,31,26,0.06);
  max-width: 1600px;
}

.carac table{
  width: 100%;
  border-collapse: collapse;
}

.carac table tr:not(:first-child):nth-child(odd){
  background: #f5f4ef;
}

.carac table tr td{
  padding: 7px 10px;
  line-height: 1.35;
  vertical-align: top;
}

.carac table tr td:nth-child(2),
.carac table tr td:nth-child(4){
  white-space: nowrap;
}

.carac table tr td b{
  display: inline-block;
  background: var(--jc-charcoal);
  color: #fff;
  font-size: 0.85em;
  padding: 2px 8px;
  border-radius: 6px;
  letter-spacing: 0.3px;
}

/* ---------- Pantalla "highlights" (portada amb vídeo de fons) ---------- */
#myVideo{
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;
}

/* Escrim permanent perque el text mai depengui nomes del video */
.mbr-fullscreen > .align-center.fixed-top{
  width: 100%;
}

.mbr-fullscreen{
  background: linear-gradient(180deg, rgba(15,18,13,0.55) 0%, rgba(15,18,13,0.72) 55%, rgba(15,18,13,0.88) 100%),
              var(--jc-charcoal);
  /* amb 26+ highlights el contingut sol ser mes alt que la pantalla;
     centrar verticalment (comportament habitual de mbr-fullscreen) el tallaria
     per dalt i per baix en un totem sense scroll. L'ancorem a dalt. */
  align-items: flex-start !important;
  padding-top: clamp(24px, 4vh, 56px);
  padding-bottom: clamp(24px, 4vh, 56px);
}

.mbr-fallback-image{
  opacity: 0.9;
}

/* Compte: ".mbr-overlay" tambe s'usa als contenidors del plano i dels
   highlights, no nomes al vel blanc superior; nomes amaguem aquest ultim
   (identificat pel seu propi background-color blanc inline). */
.mbr-overlay[style*="255, 255, 255"]{
  display: none !important;
}

.header5 h1{
  font-family: var(--jc-font) !important;
  font-size: var(--step-3) !important;
  color: #fff !important;
  text-shadow: 0 2px 18px rgba(0,0,0,0.5);
  letter-spacing: 1px;
}

.highlights{
  font-size: var(--step-0) !important;
  font-family: var(--jc-font);
  color: #fff !important;
  text-shadow: none !important;
  column-width: 340px;
  column-gap: clamp(24px, 3vw, 48px);
  column-rule: 1px solid rgba(255,255,255,0.15);
  display: block;
  width: 100%;
}

.highlights table,
.highlights tbody{
  display: contents;
}

.highlights tr{
  display: block;
  break-inside: avoid;
  padding: 9px 0;
}

.highlights tr:empty,
.highlights tr:has(td:empty){
  padding: 0;
  height: 14px;
}

.highlights td{
  display: block;
  padding-left: 30px;
  position: relative;
  line-height: 1.35;
}

.highlights td:not(:empty)::before{
  content: "✓";
  position: absolute;
  left: 0;
  color: var(--jc-orange);
  font-weight: 700;
}

/* imatge del plano, si n'hi ha, amb una mica mes de presencia */
.mbr-overlay ~ * img[alt="Julia_Camper_logo"]{
  border-radius: 12px;
}


body{ background:#111; }
.device-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:28px 12px; }
.device-caption{ color:#aaa; font:600 13px/1.4 system-ui,sans-serif; letter-spacing:1px; text-transform:uppercase; }
.device{ width:1080px; height:1920px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,0.6); border-radius:14px; background:#faf9f6; }
.logo-svg{ filter: none; height:auto; }
.carac table tr td{ line-height: 1.15 !important; }


/* ---- Densitat maxima part inferior: files estretes i tipografia petita ---- */
.carac{ padding: 10px 12px !important; }
.carac table tr td{ line-height: 1.08 !important; padding: 1px 5px !important; }
.carac table tr td b{ font-size: 0.8em !important; padding: 0px 4px !important; border-radius: 4px !important; }
.titol_taula{ font-size: 11px !important; padding-bottom: 6px !important; }
.preus{ padding: 10px 16px !important; margin-bottom: 12px !important; }
.preus table td{ padding: 4px 4px !important; font-size: 12px !important; line-height: 1.2 !important; }
.preus table tr:has(td b) td{ padding-top: 6px !important; padding-bottom: 6px !important; }
.preus table tr:last-child td{ font-size: 15px !important; }
.align-center.fixed-top{ padding: 10px 20px 14px !important; }
.align-center.fixed-top > div[style*="padding:10px"]{ margin-bottom: 8px !important; padding-bottom: 8px !important; }
.model{ margin-bottom: 10px !important; padding: 6px 18px !important; font-size: 13px !important; min-width: 0 !important; }


/* FIX CLAU: funcions.js genera <table class="carac"> DINS de <div class="carac">
   (i el mateix amb "preus"); les regles de mida amb !important tornaven a aplicar-se
   a la taula interior i anul·laven la reduccio dinamica del contenidor. */
table.carac, table.preus{ font-size: inherit !important; }


/* Insignia de versio moguda a la capcalera, a la dreta del titol */
.align-center.fixed-top > div[style*="padding:10px"] .model{
  margin: 0 0 0 auto !important;
  align-self: center !important;
}

</style>

function PintaTaules(dades, model, idioma)
{
	var preus=document.getElementById("t_preus");
	if(preus && dades.price)
	{
		var array_dades;
		if(model=="base")
			array_dades=dades.price.base;
		else
			array_dades=dades.price.expo;
		
		cadena="<table class=\"preus\">";
		for(var i=0;i<array_dades.length;i++)
		{
			cadena+="<tr><td style=\"width:80%\" align=\"right\">";
			if(array_dades[i].total)
				cadena+="<b>";
			cadena+=array_dades[i].concept;
			if(array_dades[i].total)
				cadena+="</b>";
			if(array_dades[i].separa)
				cadena+="</td><td>&nbsp;&nbsp;&nbsp;</td><td align=\"right\" style=\"border-top: solid;\">";
			else
				cadena+="</td><td>&nbsp;&nbsp;&nbsp;</td><td align=\"right\">";
			if(array_dades[i].price)
			{
				if(array_dades[i].total)
					cadena+="<b>";
				cadena+=array_dades[i].price.toFixed(2);
				if(array_dades[i].total)
					cadena+=" €</b></td></tr>";
				else
					cadena+="  €</td></tr>";
			}
			else
				cadena+="</td></tr>";
		}
		cadena+="</table><br>";
		preus.innerHTML=cadena;
	}
	var charac=document.getElementById("t_carac");
	if(charac && dades.charac)
	{
		var array_camper=dades.charac.camper;
		var array_chasis=dades.charac.chasis;
		var max=Math.max(Math.ceil(array_chasis.length/2), array_camper.length);
		if(idioma=="ger")
			cadena="<table class=\"carac\"><tr><th class=\"titol_taula\">CAMPER KONFIGURATION</th><th class=\"titol_taula\" colspan=\"3\">FAHRGESTELLKONFIGURATION</th></tr>";
		else
			cadena="<table class=\"carac\"><tr><th class=\"titol_taula\">CAMPER CONFIGURATION</th><th class=\"titol_taula\" colspan=\"3\">CHASSIS CONFIGURATION</th></tr>";
		var i_chasis=0;
		for(var i=0;i<max;i++)
		{
			cadena+="<tr><td align=\"left\">";
			if(i<array_camper.length)
				cadena+=array_camper[i];
			cadena+="</td><td align=\"left\"><b>";
			if(i_chasis<array_chasis.length)
				cadena+=array_chasis[i_chasis].code;
			cadena+="</b></td><td align=\"left\">";
			if(i_chasis<array_chasis.length)
				cadena+=array_chasis[i_chasis].desc;
			cadena+="</td><td align=\"left\"><b>";
			i_chasis++;
			if(i_chasis<array_chasis.length)
				cadena+=array_chasis[i_chasis].code;
			cadena+="</b></td><td align=\"left\">";
			if(i_chasis<array_chasis.length)
				cadena+=array_chasis[i_chasis].desc;
			cadena+="</td></tr>";
			i_chasis++;
		}
		cadena+="</table><br>";
		charac.innerHTML=cadena;
	}
	var highlights=document.getElementById("t_highlights");
	if(highlights && dades.highlights)
	{
		var array_highlights=dades.highlights;
		cadena="<table class=\"highlights\">";
		for(var i=0;i<array_highlights.length;i++)
		{
			cadena+="<tr><td align=\"left\">";
			cadena+=array_highlights[i];
			cadena+="</td>";
		}
		cadena+="</table><br>";
		highlights.innerHTML=cadena;
	}
}

<script>
function fits(deviceEl, lastEl) {
  const deviceBottom = deviceEl.getBoundingClientRect().bottom;
  const bottom = lastEl.getBoundingClientRect().bottom;
  return (deviceBottom - 6) - bottom;
}
function shrink(el, fontPx, padVPx, padHPx) {
  el.style.setProperty('font-size', fontPx + 'px', 'important');
  el.querySelectorAll('td').forEach(td => { td.style.setProperty('padding', padVPx + 'px ' + padHPx + 'px', 'important'); });
}
function fitAllToScreen(deviceEl, preusEl, caracEl) {
  let caracFont = 15, caracPadV = 3, caracPadH = 6;
  shrink(caracEl, caracFont, caracPadV, caracPadH);
  while (fits(deviceEl, caracEl) < 0 && caracFont > 7) {
    caracFont -= 0.3;
    caracPadV = Math.max(0, caracPadV - 0.3);
    caracPadH = Math.max(3, caracPadH - 0.3);
    shrink(caracEl, caracFont, caracPadV, caracPadH);
  }
  if (fits(deviceEl, caracEl) < 0) {
    let preusFont = 12, preusPadV = 4, preusPadH = 4;
    while (fits(deviceEl, caracEl) < 0 && preusFont > 9) {
      preusFont -= 0.5; preusPadV = Math.max(1.5, preusPadV - 0.5);
      shrink(preusEl, preusFont, preusPadV, preusPadH);
    }
  }
  if (fits(deviceEl, caracEl) < 0) {
    // encara no cap: comprimim capcalera (logo, titol, insignia de versio)
    const wrap = document.querySelector('.align-center.fixed-top > div[style*="padding:10px"]');
    const h1 = wrap ? wrap.querySelector('h1') : null;
    const img = wrap ? wrap.querySelector('img') : null;
    const model = document.querySelector('.model');
    let scale = 1;
    while (fits(deviceEl, caracEl) < 0 && scale > 0.45) {
      scale -= 0.08;
      if (h1) h1.style.setProperty('font-size', (36*scale) + 'px', 'important');
      if (img) img.style.setProperty('width', (60*scale) + '%', 'important');
      if (model) {
        model.style.setProperty('padding', (14*scale) + 'px ' + (32*scale) + 'px', 'important');
        model.style.setProperty('margin-bottom', (16*scale) + 'px', 'important');
        model.style.setProperty('font-size', (18*scale) + 'px', 'important');
      }
      if (wrap) wrap.style.setProperty('margin-bottom', (12*scale) + 'px', 'important');
    }
  }
  return fits(deviceEl, caracEl);
}
</script>
